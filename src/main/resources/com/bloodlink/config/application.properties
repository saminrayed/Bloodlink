# BloodLink configuration. Every value supports ${ENV_VAR:default} -- if the
# environment variable is set, it wins; otherwise the default after the colon
# is used. This exact pattern is enforced by AppConfig.java's ENV_PATTERN regex.

db.url=${DB_URL:jdbc:mysql://localhost:3306/bloodlink_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
db.username=${DB_USERNAME:root}
db.password=${DB_PASSWORD:}

ui.auto-refresh-seconds=${UI_AUTO_REFRESH_SECONDS:10}

# Push server (see com.bloodlink.push.PushServer). Optional: if this process
# isn't running, PushClient fails silently and every dashboard's periodic
# poll above keeps the app correct regardless.
push.host=${PUSH_HOST:localhost}
push.port=${PUSH_PORT:8887}
